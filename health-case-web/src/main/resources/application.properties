server.port=8099

app.auth.test-code-enabled=${AUTH_TEST_CODE_ENABLED:false}

server.servlet.session.timeout=2h
server.servlet.session.cookie.name=HEALTH_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie

# ==================== Spring ====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB


# ==================== MySQL ====================
################################################################
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=DatebookHikariCP
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# ==================== MyBatis-Plus ====================
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl


# ==================== ?? ====================
file.upload-path=${LEGACY_UPLOAD_PATH:./upload}
file.access-url=/upload/

# Huawei Cloud OBS (private bucket; credentials supplied by environment)
# Also accept the existing huaweiyun.obs.* property names used in local configuration.
#ON OFF

# Browser access (comma-separated exact origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml

# UI picture configuration
app.ui.initialize-schema=${UI_INITIALIZE_SCHEMA:true}
# Log completed page/banner/asset write operations in the IDEA Run console.
logging.level.com.kaiyun.infrastructure.logging.PlatformOperationLog=${UI_OPERATION_LOG_LEVEL:INFO}
# Optional one-time bootstrap for a new database. Existing credentials are read from admin_permission.
app.admin.initial-password=${ADMIN_ROOT_PASSWORD:}
# Create admin_permission on startup when needed.
app.admin.initialize-schema=${ADMIN_INITIALIZE_SCHEMA:true}

# Blank URL uses this application's /api/messaging/case-push/receive endpoint on its actual port.
# Local callbacks share a random per-process token when receiver-token is blank.
# To use an external receiver, fill in its HTTPS URL and Bearer token.
app.case-push.receiver-url=${CASE_PUSH_RECEIVER_URL:}
app.case-push.receiver-token=${CASE_PUSH_RECEIVER_TOKEN:}
# Show case push lifecycle messages in the IDEA Run console.
logging.level.com.kaiyun.mq=${CASE_PUSH_LOG_LEVEL:INFO}
app.case-tasks.initialize-schema=${CASE_TASKS_INITIALIZE_SCHEMA:true}
# RabbitMQ is the default. Set CASE_PUSH_TRANSPORT=mysql to use the database worker.
app.case-push.transport=${CASE_PUSH_TRANSPORT:rabbitmq}
app.case-push.rabbit-queue=${CASE_PUSH_RABBIT_QUEUE:custpost.case-push}


# Fill in the broker address, credentials and vhost. Blank credentials leave case push disabled.
# The default AMQP port is 5672. For TLS, enable SSL and use the broker's TLS port.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.max-concurrency=50
spring.rabbitmq.listener.simple.concurrency=10
spring.rabbitmq.listener.simple.prefetch=20



spring.application.name=health-case-web
app.integration.encryption-key=${INTEGRATION_ENCRYPTION_KEY:}
app.admin.root-phone=${ADMIN_ROOT_PHONE:}



