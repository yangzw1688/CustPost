# Standalone deployment: no Nacos client is required.
# The standalone profile is loaded by default. Set the DB_* and OBS_* variables before starting.
spring.application.name=health-case-web
server.port=8099
server.servlet.session.timeout=2h
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=HEALTH_SESSION
server.servlet.session.cookie.http-only=true
# 【按访问方式设置】本地 HTTP 默认 false；线上 HTTPS 设置环境变量 SESSION_COOKIE_SECURE=true。
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=DatebookHikariCP
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

#ON OFF

# 附件上传读取 obs.*，优先使用环境变量，否则沿用上面的华为云配置。
obs.endpoint=${OBS_ENDPOINT:${huaweiyun.obs.endpoint:}}
obs.bucket=${OBS_BUCKET:${huaweiyun.obs.bucketName:}}
obs.access-key=${OBS_ACCESS_KEY:${huaweiyun.obs.accessKeyId:}}
obs.secret-key=${OBS_SECRET_KEY:${huaweiyun.obs.accessKeySecret:}}

app.auth.test-code-enabled=${AUTH_TEST_CODE_ENABLED:false}
# 【跨域时替换】页面来源只包含协议、主机和端口；单端口同源部署可填实际应用来源。
# 本地示例：http://localhost:8099；多个来源逗号分隔，不填 /admin/ 路径或 *。
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
# 【按需修改】缺少 ui 表时自动创建；手工建表或账号无 CREATE 权限时设 false。
app.ui.initialize-schema=true
# 【要维护界面图片时替换】登录手机号，多人用英文逗号分隔；不需要该功能时可留空。
app.ui.admin-phones=${UI_ADMIN_PHONES:}

# 【有历史本地附件才需修改】应用服务器目录。Windows 示例 D:/work/upload/；新上传走 OBS。
file.upload-path=${LEGACY_UPLOAD_PATH:./upload}
logging.level.root=INFO
logging.level.com.kaiyun.mapper=WARN
