# 【本地连接文件】不要上传到 Nacos。应用先靠本文件连接配置中心，之后才读取远程 YAML。
# 只有 mvn clean package -Pnacos 构建才会把本文件复制到 JAR classpath 根目录并启用客户端。
# 如果在 IDE 启动，需要先启用 Maven 的 nacos profile 并重新加载 Maven、编译资源。
# 手动填写有两种方式，任选其一：
# 方式一：保留 ${变量名}，在运行 Java 的机器或 IDE 环境变量中设置对应变量。
# 方式二：把等号右侧的整个 ${...} 替换为真实值；本地文件改动后重新构建。
# 注意：这里填写的是 Nacos 地址和 Nacos 账号，不是数据库账号，也不是 OBS 密钥。

# 【保持不变】应用名 + prod + yaml 决定默认 Data ID：health-case-web-prod.yaml。
spring.application.name=health-case-web
spring.profiles.active=prod
spring.cloud.nacos.config.enabled=true
# 【必须提供】Nacos 配置服务地址。环境变量 NACOS_SERVER_ADDR，例如 192.0.2.10:8848。
# 直接填写的格式示例：spring.cloud.nacos.config.server-addr=你的Nacos主机:8848
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
# 【按需提供】命名空间 ID，复制控制台中的 ID，不填显示名称。使用 Public 时留空即可。
# ${NACOS_NAMESPACE:} 中冒号后为空，表示未设置环境变量时默认空字符串。
spring.cloud.nacos.config.namespace=${NACOS_NAMESPACE:}
# 【通常不改】必须与控制台发布配置所用的 Group 完全一致，默认 HEALTH_CASE。
spring.cloud.nacos.config.group=${NACOS_GROUP:HEALTH_CASE}
# 【保持不变】控制台配置格式选 YAML，Data ID 后缀为 .yaml。
spring.cloud.nacos.config.file-extension=yaml
spring.cloud.nacos.config.encode=UTF-8
# 【开启 Nacos 鉴权时必填】Nacos 用户名和密码；未开启鉴权时可保持默认空值。
# 可设置 NACOS_USERNAME / NACOS_PASSWORD，也可直接替换各行等号后的整个占位符。
spring.cloud.nacos.config.username=${NACOS_USERNAME:}
spring.cloud.nacos.config.password=${NACOS_PASSWORD:}
# 【通常不改】读取远程配置的超时时间，单位毫秒。
spring.cloud.nacos.config.timeout=10000
# 【保持不变】当前业务配置在启动时注入，Nacos 发布修改后必须重启应用才生效。
spring.cloud.nacos.config.refresh-enabled=false
