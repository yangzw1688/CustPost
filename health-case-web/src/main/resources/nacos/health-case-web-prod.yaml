# Nacos Data ID: health-case-web-prod.yaml
# The values come from the application's environment or the private Nacos configuration.
server:
  port: 8099
  servlet:
    session:
      timeout: 12h
      tracking-modes: cookie
      cookie:
        name: HEALTH_CASE_SESSION
        http-only: true
        secure: true
spring:
  application:
    name: health-case-web
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    url: "${DB_URL:}"
    username: "${DB_USERNAME:}"
    password: "${DB_PASSWORD:}"
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      auto-commit: true
      idle-timeout: 300000
      pool-name: HealthCaseHikariCP
      max-lifetime: 1200000
      connection-timeout: 10000
      connection-test-query: SELECT 1
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
obs:
  endpoint: "${OBS_ENDPOINT:}"
  bucket: "${OBS_BUCKET:}"
  access-key: "${OBS_ACCESS_KEY:}"
  secret-key: "${OBS_SECRET_KEY:}"
  url-expiry-seconds: 3600
app:
  auth:
    test-code-enabled: false
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:}"
  ui:
    initialize-schema: false
    admin-phones: "${UI_ADMIN_PHONES:}"
file:
  upload-path: "${LEGACY_UPLOAD_PATH:./upload}"
logging:
  level:
    root: INFO
    com.kaiyun.mapper: WARN

